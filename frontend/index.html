<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>Bookly</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="app-title">Bookly</h1>
    <nav id="nav" aria-label="navigation">
      <button class="nav-btn active" data-view="library"></button>
      <button class="nav-btn" data-view="search"></button>
      <button class="nav-btn" data-view="settings"></button>
    </nav>
  </header>

  <main id="app">
    <section id="library" class="library">
      <p id="library-empty" hidden></p>
      <ul id="book-list"></ul>
    </section>

    <section id="search" class="search" hidden>
      <input id="search-input" type="search" autocomplete="off">
      <div id="search-results"></div>
      <div id="recommendations" hidden></div>
    </section>

    <section id="settings" class="settings" hidden>
      <h2 id="settings-title"></h2>
      <div id="prefs-editor"></div>
    </section>
  </main>

  <div id="onboarding" class="onboarding" hidden>
    <div class="onboarding-card">
      <h2 id="ob-title"></h2>
      <p id="ob-intro"></p>
      <div id="ob-step"></div>
      <div class="onboarding-actions">
        <button id="ob-skip" class="btn ghost"></button>
        <button id="ob-next" class="btn primary"></button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
